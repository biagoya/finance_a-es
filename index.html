<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comparador de Ações</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Comparador de Ações</h1>
    <p id="updated" class="muted">Carregando dados…</p>
  </header>

  <main>
    <section id="cards" class="cards"></section>

    <section class="panel">
      <div class="panel-head">
        <h2>Desempenho relativo (base 100)</h2>
        <div id="periods" class="periods" role="group" aria-label="Período">
          <button data-days="21">1M</button>
          <button data-days="63">3M</button>
          <button data-days="126">6M</button>
          <button data-days="0" class="active">1A</button>
        </div>
      </div>
      <div class="chart-wrap"><canvas id="chart"></canvas></div>
    </section>

    <section class="panel">
      <h2>Comparativo</h2>
      <div class="table-wrap">
        <table id="table">
          <thead>
            <tr>
              <th>Ação</th><th>Preço</th><th>Dia</th><th>1M</th><th>6M</th><th>1A</th>
              <th>Mín. 52s</th><th>Máx. 52s</th><th>Volume</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <p class="muted small">
      Dados do Yahoo Finance (endpoint não oficial), atualizados por GitHub Actions.
      Podem ter atraso. Isto não é recomendação de investimento.
    </p>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
