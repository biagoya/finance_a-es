name: Atualizar cotações

on:
  schedule:
    # Dias úteis, a cada hora entre 10h e 18h (horário de Brasília = UTC-3).
    - cron: "7 13-21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/fetch-quotes.mjs
      - name: Commit dos dados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quotes.json
          git diff --cached --quiet || git commit -m "Atualiza cotações"
          git push
